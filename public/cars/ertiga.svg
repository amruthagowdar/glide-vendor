<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="100%" height="100%">
  <defs>
    <!-- Car body gradient (Taller MPV / SUV profile) -->
    <linearGradient id="suvBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <!-- Roof highlight -->
    <linearGradient id="suvRoofGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <!-- Glass gradient -->
    <linearGradient id="suvGlassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="40%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <!-- Shadow gradient -->
    <radialGradient id="suvShadowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(15, 23, 42, 0.4)"/>
      <stop offset="70%" stop-color="rgba(15, 23, 42, 0.18)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0)"/>
    </radialGradient>
    <!-- Chrome gradient -->
    <linearGradient id="suvChromeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="250" cy="245" rx="215" ry="24" fill="url(#suvShadowGrad)"/>

  <!-- Rear Wheel (Taller SUV Stance) -->
  <g transform="translate(390, 202)">
    <circle cx="0" cy="0" r="38" fill="#1e293b"/>
    <circle cx="0" cy="0" r="30" fill="#475569"/>
    <circle cx="0" cy="0" r="23" fill="#64748b"/>
    <circle cx="0" cy="0" r="15" fill="#cbd5e1"/>
    <circle cx="0" cy="0" r="7" fill="#0f172a"/>
  </g>

  <!-- Front Wheel (Taller SUV Stance) -->
  <g transform="translate(130, 202)">
    <circle cx="0" cy="0" r="38" fill="#1e293b"/>
    <circle cx="0" cy="0" r="30" fill="#475569"/>
    <circle cx="0" cy="0" r="23" fill="#64748b"/>
    <circle cx="0" cy="0" r="15" fill="#cbd5e1"/>
    <circle cx="0" cy="0" r="7" fill="#0f172a"/>
  </g>

  <!-- Car Body Main Hull (Taller Ertiga MPV/SUV Body) -->
  <path d="M 55 195 
           C 60 175, 75 145, 115 140 
           C 145 135, 175 125, 205 105 
           C 230 85, 260 62, 335 62 
           C 385 62, 430 75, 450 115 
           C 460 135, 465 155, 465 175 
           C 465 195, 455 204, 442 206 
           L 426 208 
           C 420 172, 355 172, 350 208 
           L 168 208 
           C 162 172, 98 172, 92 208 
           L 65 205 
           C 55 205, 50 200, 55 195 Z" 
        fill="url(#suvBodyGrad)" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Roof Rails (Distinct SUV Feature) -->
  <rect x="225" y="58" width="180" height="4" rx="2" fill="#94a3b8"/>
  <rect x="240" y="60" width="8" height="5" fill="#475569"/>
  <rect x="385" y="60" width="8" height="5" fill="#475569"/>

  <!-- Large Glass Windows (3-Row Ertiga Cabin) -->
  <!-- Windshield -->
  <path d="M 198 108 
           C 222 88, 252 68, 285 68 
           L 285 116 
           C 255 116, 220 114, 198 108 Z" 
        fill="url(#suvGlassGrad)"/>
  <path d="M 218 102 L 272 74" stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-linecap="round"/>

  <!-- Middle Window -->
  <path d="M 292 68 
           L 360 68 
           L 360 116 
           L 292 116 Z" 
        fill="url(#suvGlassGrad)"/>

  <!-- 3rd Row Quarter Glass (Ertiga Signature Float) -->
  <path d="M 366 68 
           C 400 70, 428 85, 442 112 
           L 366 116 Z" 
        fill="url(#suvGlassGrad)"/>

  <!-- Pillars -->
  <rect x="285" y="66" width="7" height="52" fill="#1e293b"/>
  <rect x="360" y="66" width="6" height="52" fill="#1e293b"/>

  <!-- Large Projector Headlamps -->
  <path d="M 70 162 C 82 148, 118 146, 134 154 C 124 166, 94 174, 76 175 Z" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="100" cy="160" r="5" fill="#ffffff"/>

  <!-- Bold Chrome Slatted Grille (Ertiga Front Facia) -->
  <path d="M 58 180 C 68 174, 112 172, 122 178 C 112 196, 75 198, 58 190 Z" fill="#0f172a"/>
  <line x1="64" y1="178" x2="116" y2="178" stroke="url(#suvChromeGrad)" stroke-width="2.5"/>
  <line x1="68" y1="184" x2="112" y2="184" stroke="url(#suvChromeGrad)" stroke-width="2"/>
  <line x1="74" y1="190" x2="106" y2="190" stroke="url(#suvChromeGrad)" stroke-width="1.5"/>

  <!-- Door Lines for 3 Rows -->
  <path d="M 288 118 L 282 204" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M 363 118 L 358 204" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="305" y="128" width="18" height="4" rx="2" fill="#cbd5e1" stroke="#64748b" stroke-width="0.8"/>
  <rect x="235" y="128" width="18" height="4" rx="2" fill="#cbd5e1" stroke="#64748b" stroke-width="0.8"/>

  <!-- License Plate: ERTIGA -->
  <g transform="translate(66, 188)">
    <rect x="0" y="0" width="46" height="13" rx="2" fill="#ffffff" stroke="#334155" stroke-width="1"/>
    <text x="23" y="10" font-family="Arial, sans-serif" font-weight="900" font-size="8" fill="#0f172a" text-anchor="middle" letter-spacing="1">ERTIGA</text>
  </g>
</svg>