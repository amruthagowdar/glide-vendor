<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="100%" height="100%">
  <defs>
    <!-- Car body gradient -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <!-- Roof highlight -->
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <!-- Glass gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="40%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <!-- Shadow gradient -->
    <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(15, 23, 42, 0.35)"/>
      <stop offset="70%" stop-color="rgba(15, 23, 42, 0.15)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0)"/>
    </radialGradient>
    <!-- Chrome gradient -->
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="250" cy="245" rx="210" ry="22" fill="url(#shadowGrad)"/>

  <!-- Rear Wheel (Perspective) -->
  <g transform="translate(385, 205)">
    <circle cx="0" cy="0" r="36" fill="#1e293b"/>
    <circle cx="0" cy="0" r="28" fill="#475569"/>
    <circle cx="0" cy="0" r="22" fill="#64748b"/>
    <circle cx="0" cy="0" r="14" fill="#cbd5e1"/>
    <circle cx="0" cy="0" r="6" fill="#0f172a"/>
  </g>

  <!-- Front Wheel (Perspective) -->
  <g transform="translate(135, 205)">
    <circle cx="0" cy="0" r="36" fill="#1e293b"/>
    <circle cx="0" cy="0" r="28" fill="#475569"/>
    <circle cx="0" cy="0" r="22" fill="#64748b"/>
    <circle cx="0" cy="0" r="14" fill="#cbd5e1"/>
    <circle cx="0" cy="0" r="6" fill="#0f172a"/>
  </g>

  <!-- Car Body Main Hull -->
  <path d="M 60 195 
           C 65 180, 80 155, 110 150 
           C 140 145, 175 140, 200 120 
           C 225 100, 260 75, 310 75 
           C 360 75, 410 95, 435 125 
           C 445 138, 455 152, 460 170 
           C 465 188, 455 200, 440 205 
           L 420 208 
           C 415 178, 355 178, 350 208 
           L 170 208 
           C 165 178, 105 178, 100 208 
           L 70 205 
           C 60 205, 55 200, 60 195 Z" 
        fill="url(#bodyGrad)" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Roof & Cabin -->
  <path d="M 195 122 
           C 220 102, 255 78, 305 78 
           C 350 78, 395 96, 420 125 
           C 405 126, 370 128, 340 128 
           C 280 128, 220 125, 195 122 Z" 
        fill="url(#roofGrad)"/>

  <!-- Windshield and Windows -->
  <!-- Front Windshield -->
  <path d="M 192 124 
           C 215 106, 245 84, 290 84 
           L 290 126 
           C 255 126, 215 125, 192 124 Z" 
        fill="url(#glassGrad)"/>
  <path d="M 215 118 L 275 90" stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-linecap="round"/>

  <!-- Rear Passenger Window -->
  <path d="M 298 84 
           C 340 84, 380 98, 408 124 
           C 375 126, 335 126, 298 126 Z" 
        fill="url(#glassGrad)"/>
  <path d="M 320 90 L 385 118" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Pillar Divider -->
  <rect x="290" y="82" width="8" height="46" fill="#1e293b"/>

  <!-- Front Hood & Bumper Contours -->
  <path d="M 70 190 C 80 165, 120 152, 185 146 C 188 152, 188 156, 185 160 C 130 166, 95 178, 70 190 Z" fill="#ffffff" opacity="0.6"/>

  <!-- Headlights (Angled Sedan Style) -->
  <path d="M 75 170 C 85 158, 115 156, 130 162 C 120 172, 95 180, 80 182 Z" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/>
  <path d="M 85 168 C 95 162, 115 162, 122 166" stroke="#ffffff" stroke-width="2" fill="none"/>

  <!-- Front Grille with Chrome Trim -->
  <path d="M 62 188 C 70 182, 105 180, 115 185 C 105 200, 75 202, 62 195 Z" fill="#0f172a"/>
  <line x1="68" y1="187" x2="110" y2="187" stroke="url(#chromeGrad)" stroke-width="2"/>
  <line x1="72" y1="192" x2="105" y2="192" stroke="url(#chromeGrad)" stroke-width="1.5"/>

  <!-- Side Mirror -->
  <path d="M 200 126 C 185 122, 180 132, 195 136 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>

  <!-- Door Lines & Handles -->
  <path d="M 292 128 L 285 204" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="315" y="138" width="18" height="4" rx="2" fill="#cbd5e1" stroke="#64748b" stroke-width="0.8"/>
  <rect x="235" y="138" width="18" height="4" rx="2" fill="#cbd5e1" stroke="#64748b" stroke-width="0.8"/>

  <!-- License Plate: DZIRE -->
  <g transform="translate(68, 194)">
    <rect x="0" y="0" width="42" height="13" rx="2" fill="#ffffff" stroke="#334155" stroke-width="1"/>
    <text x="21" y="10" font-family="Arial, sans-serif" font-weight="900" font-size="8" fill="#0f172a" text-anchor="middle" letter-spacing="1">DZIRE</text>
  </g>
</svg>